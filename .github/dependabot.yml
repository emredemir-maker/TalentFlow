# BAĞIMLILIK GÜNCELLEMELERİ.
#
# Depoda 3 kritik ve 40'ın üzerinde yüksek seviye açık birikmişti; hiçbiri
# yeni değildi, yalnızca kimse bakmıyordu. Tarama (ci.yml → audit) birikmeyi
# görünür kılıyor, bu dosya birikmesini engelliyor.
#
# ── GRUPLAMA: MAJOR AYRI, GERİSİ BİRLİKTE ───────────────────────────────────
# Bu ayar iki kez yanlış kuruldu, ikisi de canlıda görüldü:
#
#   1. Gruplar minor/patch ile sınırlı, GitHub Actions'ın grubu yok
#      → ilk çalıştırmada 10 ayrı PR. Kimsenin bakmadığı bir yığın, hiç
#        güncelleme yapmamakla aynı yere çıkıyor.
#
#   2. Düzeltme olarak major dahil her şey tek gruba alındı
#      → 29 güncellemelik tek PR ve 7 kontrolün 7'si kırmızı. Dependabot
#        eslint'i 10'a çıkarmıştı, eslint-plugin-react henüz desteklemiyor,
#        npm ci ERESOLVE ile düştü. TEK UYUMSUZ MAJOR, İÇİNDEKİ GÜVENLİ
#        YAMALARIN TAMAMINI KİLİTLEDİ.
#
# Doğru şekil ikisinin arası: minor ve patch tek grupta (güvenli, okunur,
# merge edilebilir); major yükseltmeler AYRI PR'larda, çünkü her biri kendi
# başına değerlendirilmeli ve reddedilebilmeli. Böylece uyumsuz bir major
# yalnızca kendini düşürüyor, güvenli yamaları rehin almıyor.
#
# Üst sınırlar düşük tutuluyor: ayrı gelen major'lar sıraya giriyor, yığın
# oluşturmuyor.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      # Güvenlik yamaları ayrı: sürüm yükseltmelerinin arasında kaybolmasın,
      # ayrıca ve öncelikle bakılabilsin.
      guvenlik:
        applies-to: security-updates
        patterns: ['*']
      bagimliliklar:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      guvenlik:
        applies-to: security-updates
        patterns: ['*']
      bagimliliklar:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      # Bu ekosistemde grup hiç tanımlanmamıştı: beş action için beş ayrı PR
      # açıldı. Action sürümleri birlikte yükseltiliyor, ayrı ayrı okunmuyor.
      actions:
        patterns: ['*']
