# BAĞIMLILIK GÜNCELLEMELERİ.
#
# Depoda 3 kritik ve 40'ın üzerinde yüksek seviye açık birikmişti; hiçbiri
# yeni değildi, yalnızca kimse bakmıyordu. Tarama (ci.yml → audit) birikmeyi
# görünür kılıyor, bu dosya birikmesini engelliyor.
#
# ── NEDEN HER ŞEY TEK GRUPTA ────────────────────────────────────────────────
# İlk sürümde gruplar `minor` ve `patch` ile sınırlıydı ve MAJOR yükseltmeler
# grubun dışında kalıp her biri ayrı PR açtı; GitHub Actions'ın grubu ise hiç
# yoktu. Sonuç ilk çalıştırmada 10 PR oldu — tam da engellemek istediğimiz
# şey. Kimsenin bakmadığı bir PR yığını, hiç güncelleme yapmamakla aynı yere
# çıkıyor.
#
# Artık major dahil hepsi tek grupta. Major yükseltme kırıcı olabilir; onu
# ayrı ayrı PR'lara bölmek riski azaltmıyor, yalnızca okunmayan PR sayısını
# artırıyor. Gruplanmış tek PR okunuyor, kırılan olursa oradan ayıklanıyor.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      # Güvenlik yamaları ayrı: sürüm yükseltmelerinin arasında kaybolmasın,
      # ayrıca ve öncelikle bakılabilsin.
      guvenlik:
        applies-to: security-updates
        patterns: ['*']
      bagimliliklar:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      guvenlik:
        applies-to: security-updates
        patterns: ['*']
      bagimliliklar:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      # Bu ekosistemde grup hiç tanımlanmamıştı: beş action için beş ayrı PR
      # açıldı. Action sürümleri birlikte yükseltiliyor, ayrı ayrı okunmuyor.
      actions:
        patterns: ['*']
