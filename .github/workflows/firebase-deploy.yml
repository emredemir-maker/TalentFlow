name: Deploy to Firebase

on:
  push:
    branches:
      - main
  # Elle tetikleme. 2026-08-06 Actions arızasında bir merge'ün push webhook'u
  # düştü ve o commit için hiç koşu oluşmadı; deploy'u yeniden başlatmanın
  # hiçbir yolu kalmadı, main'e yeni bir push atmak gerekti.
  workflow_dispatch:

# Aynı anda tek deploy. cancel-in-progress: false bilinçli — çalışan bir
# deploy'u ortasında kesmek Hosting ile Functions'ı farklı sürümlerde
# bırakabilir. Bu ayarla çalışan koşu bitene kadar beklenir, kuyrukta ise
# yalnızca EN YENİ koşu hayatta kalır. Böylece gecikmiş eski bir koşu, yeni
# sürümün üzerine eski kodu yazamaz.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check required secrets
        run: |
          if [ -z "$EMAIL_USER" ] || [ -z "$EMAIL_PASS" ]; then
            echo "❌ EMAIL_USER veya EMAIL_PASS secret eksik!"
            exit 1
          fi
          echo "✅ Tüm gerekli secrets mevcut"
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

      - name: Install root dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: talentflow-84bb6.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: talentflow-84bb6
          VITE_FIREBASE_STORAGE_BUCKET: talentflow-84bb6.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "132883257197"
          VITE_FIREBASE_APP_ID: 1:132883257197:web:9c569a6c8fa52b0cfe6c64
          VITE_SERVER_URL: https://talentflow-84bb6.web.app
          VITE_APP_URL: https://talentflow-84bb6.web.app

      - name: Install Functions dependencies
        run: npm install
        working-directory: ./functions
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Create functions/.env.production
        run: |
          printf 'EMAIL_USER=%s\nEMAIL_PASS=%s\nVITE_GEMINI_API_KEY=%s\nVITE_FIREBASE_API_KEY=%s\nAI_DAILY_TOKEN_LIMIT=%s\nAI_DAILY_GROUNDED_LIMIT=%s\n' \
            "$EMAIL_USER" \
            "$EMAIL_PASS" \
            "$VITE_GEMINI_API_KEY" \
            "$VITE_FIREBASE_API_KEY" \
            "$AI_DAILY_TOKEN_LIMIT" \
            "$AI_DAILY_GROUNDED_LIMIT" \
            > functions/.env.production
          echo "✅ functions/.env.production oluşturuldu:"
          cat functions/.env.production | sed 's/=.*/=***/' 
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          # SIR DEĞİL ama buradan geçiyor: fonksiyonlar ortam değişkenlerini
          # yalnızca bu dosyadan okuyor. Secret tanımlı değilse satır boş
          # yazılır ve günlük AI bütçe freni KAPALI kalır — mevcut kurulumun
          # davranışı değişmez (bkz. functions/services/aiBudget.js).
          AI_DAILY_TOKEN_LIMIT: ${{ secrets.AI_DAILY_TOKEN_LIMIT }}
          # Aramalı çağrı ADEDİ — token tavanından ayrı bir fatura kalemi:
          # arama destekli çağrılar istek başına faturalanıyor ve token
          # tavanı bu kalemi görmüyor.
          AI_DAILY_GROUNDED_LIMIT: ${{ secrets.AI_DAILY_GROUNDED_LIMIT }}

      - name: Authenticate to Google Cloud
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> $GITHUB_ENV

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        # 'storage' listede YOKTU: storage.rules deponun içinde duruyor ama
        # üretime hiç gitmiyordu. Kuralda yapılan her değişiklik sessizce
        # dosyada kalıyor, tarayıcı ise eski kurallara çarpıyordu — toplu
        # yüklemenin bulk-imports/{uid}/ yoluna yazması tam olarak böyle
        # "permission denied" alırdı ve sebebi hiçbir logda görünmezdi.
        run: firebase deploy --only hosting,functions,firestore,storage --project talentflow-84bb6
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa.json
        # Env vars are picked up automatically from functions/.env.production (created
        # in the "Create functions/.env.production" step above). Firebase Functions v2
        # injects them into the Cloud Run revision during deploy — no manual gcloud
        # run services update is needed. The previous manual step referenced a fixed
        # image tag (api:version_1) that Firebase no longer produces, causing CI
        # failures while the actual deploy had already succeeded.
