name: Deploy to Firebase

on:
  push:
    branches:
      - main
  # Elle tetikleme. 2026-08-06 Actions arızasında bir merge'ün push webhook'u
  # düştü ve o commit için hiç koşu oluşmadı; deploy'u yeniden başlatmanın
  # hiçbir yolu kalmadı, main'e yeni bir push atmak gerekti.
  workflow_dispatch:

# Aynı anda tek deploy. cancel-in-progress: false bilinçli — çalışan bir
# deploy'u ortasında kesmek Hosting ile Functions'ı farklı sürümlerde
# bırakabilir. Bu ayarla çalışan koşu bitene kadar beklenir, kuyrukta ise
# yalnızca EN YENİ koşu hayatta kalır. Böylece gecikmiş eski bir koşu, yeni
# sürümün üzerine eski kodu yazamaz.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # ── HEDEF TEK YERDE: .firebaserc (proje) + firebase.json (site) ─────
      # Üretim Hub-Inn platform projesinde (agentinn-nyqpx). Proje Hub-Inn
      # (varsayılan site agentinn-nyqpx, codebase `api`, fonksiyon `api`) ve
      # CX-Inn (site cxinn, Cloud Run cx-inn-api) ile PAYLAŞILIYOR. TalentFlow
      # yalnızca kendi parçalarını dağıtır: adlı site, `talentflow` codebase'i,
      # Firestore/Storage kuralları. Koruma (check:project) yer tutucuyu, eski
      # projeleri, site adı eksik/çoklu hosting girdili bir firebase.json'u,
      # başka bir uygulamanın sitesini ve `talentflow` dışındaki bir codebase'i
      # reddediyor — hiçbir şey dağıtılmaz. Bkz. docs/yeni-proje-kurulumu.md.
      #
      # Türetilemeyen herkese açık değerler (web uygulamasının numaraları,
      # bucket adı) repo DEĞİŞKENİ: Settings → Secrets and variables →
      # Actions → Variables. Bucket adı türetilemiyor çünkü eski projelerde
      # <proje>.appspot.com, yenilerde <proje>.firebasestorage.app.
      - name: Firebase projesini belirle
        run: |
          node scripts/check-project-config.mjs
          P=$(node scripts/check-project-config.mjs --print)
          SITE=$(node scripts/check-project-config.mjs --print-site)
          if [ -z "$SENDER_ID" ] || [ -z "$APP_ID" ]; then
            echo "❌ Eksik repo değişkeni: FIREBASE_MESSAGING_SENDER_ID ve/veya FIREBASE_APP_ID"
            exit 1
          fi
          # appId "1:<gönderici-no>:web:..." biçiminde. İkisi farklı projelerden
          # kopyalanırsa giriş çalışır gibi görünüp yanlış uygulamaya bağlanır.
          case "$APP_ID" in
            "1:$SENDER_ID:web:"*) ;;
            *) echo "❌ FIREBASE_APP_ID, FIREBASE_MESSAGING_SENDER_ID ile eşleşmiyor"; exit 1 ;;
          esac
          URL="${APP_URL_OVERRIDE:-https://$SITE.web.app}"
          {
            echo "PROJECT_ID=$P"
            echo "APP_URL=${URL%/}"
            echo "STORAGE_BUCKET=${BUCKET_VAR:-$P.firebasestorage.app}"
          } >> "$GITHUB_ENV"
          echo "✅ Proje: $P  site: $SITE  →  ${URL%/}"
        env:
          SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ vars.FIREBASE_APP_ID }}
          # Özel alan adı bağlanırsa (ör. https://ik.ornek.com) yalnızca bu
          # değişken eklenir; boşsa sitenin web.app adresi kullanılır.
          APP_URL_OVERRIDE: ${{ vars.APP_URL }}
          BUCKET_VAR: ${{ vars.FIREBASE_STORAGE_BUCKET }}

      - name: Check required secrets
        run: |
          eksik=""
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && eksik="$eksik FIREBASE_SERVICE_ACCOUNT"
          [ -z "$VITE_FIREBASE_API_KEY" ] && eksik="$eksik VITE_FIREBASE_API_KEY"
          [ -z "$EMAIL_USER" ] && eksik="$eksik EMAIL_USER"
          [ -z "$EMAIL_PASS" ] && eksik="$eksik EMAIL_PASS"
          [ -z "$VITE_GEMINI_API_KEY" ] && eksik="$eksik VITE_GEMINI_API_KEY"
          [ -z "$INTEGRATION_ENCRYPTION_KEY" ] && eksik="$eksik INTEGRATION_ENCRYPTION_KEY"
          if [ -n "$eksik" ]; then
            echo "❌ Eksik secret:$eksik"
            exit 1
          fi
          echo "✅ Tüm gerekli secrets mevcut"

          # Tavanlar ZORUNLU DEĞİL ama boş olmaları sessiz bir risk: fren
          # kapalı demek. Dağıtımı durdurmuyoruz, görünür kılıyoruz.
          if [ -z "$AI_DAILY_TOKEN_LIMIT" ] || [ -z "$AI_DAILY_GROUNDED_LIMIT" ]; then
            echo "::warning::Günlük AI bütçe freni KAPALI — AI_DAILY_TOKEN_LIMIT / AI_DAILY_GROUNDED_LIMIT secret'ları boş." 
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
          AI_DAILY_TOKEN_LIMIT: ${{ secrets.AI_DAILY_TOKEN_LIMIT }}
          AI_DAILY_GROUNDED_LIMIT: ${{ secrets.AI_DAILY_GROUNDED_LIMIT }}

      - name: Install root dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          # authDomain projenin firebaseapp.com alanı (Auth yönlendirmeleri
          # orada); bucket repo değişkeninden, adres site adından.
          VITE_FIREBASE_AUTH_DOMAIN: ${{ env.PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ env.STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_SERVER_URL: ${{ env.APP_URL }}
          VITE_APP_URL: ${{ env.APP_URL }}

      - name: Install Functions dependencies
        run: npm install
        working-directory: ./functions
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      # ── DOSYA ADI: .env.production DEĞİL, .env ───────────────────────────
      #
      # Firebase Functions YALNIZCA şu adları yüklüyor: `.env`,
      # `.env.<proje-id>` ve `.env.<takma-ad>`. `.firebaserc`'de yalnızca
      # `default` var, "production" diye bir takma ad YOK — yani
      # `functions/.env.production` hiçbir zaman OKUNMADI.
      #
      # NASIL ANLAŞILDI: dağıtılmış Cloud Run servisinde EMAIL_USER ve
      # VITE_GEMINI_API_KEY var ama AI_DAILY_TOKEN_LIMIT YOK. Var olanlar
      # daha önce elle set edilmiş ve Cloud Run'ın koruduğu kalıntılar;
      # dosyadan gelen hiçbir şey ulaşmamış. Demo akışı `.env` yazıyor ve
      # onun değişkenleri konteynerde görünüyor — aradaki tek fark ad.
      #
      # SONUÇ: üretimde günlük AI bütçe freni HİÇ ÇALIŞMADI. Bu dosyaya
      # eklenecek her yeni değişken de aynı sessizlikle kaybolurdu.
      #
      # ── PROJE DEĞERLERİ DE YAZILIYOR (yeni projeyle eklendi) ─────────────
      # VITE_FIREBASE_PROJECT_ID: Firestore REST yardımcıları (services/
      # firestoreRest.js, routes/positions.js) proje kimliğini YALNIZCA bu
      # addan okuyor. Eski Cloud Run servisinde büyük olasılıkla elle
      # girilmiş bir kalıntı olarak duruyordu (yukarıdaki not); temiz bir
      # projede o kalıntı yok ve URL "projects/undefined" olurdu.
      # VITE_FIREBASE_STORAGE_BUCKET: bucket FIREBASE_CONFIG'ten de bulunuyor;
      # açıkça vermek ilk açılışta tahmine yer bırakmıyor.
      # APP_URL: adaya giden yanıt bağlantılarının kökü (routes/email.js) ve
      # CORS izin listesi (middleware/cors.js).
      - name: Create functions/.env
        run: |
          printf 'EMAIL_USER=%s\nEMAIL_PASS=%s\nGEMINI_API_KEY=%s\nVITE_FIREBASE_API_KEY=%s\nINTEGRATION_ENCRYPTION_KEY=%s\nAI_DAILY_TOKEN_LIMIT=%s\nAI_DAILY_GROUNDED_LIMIT=%s\nVITE_FIREBASE_PROJECT_ID=%s\nVITE_FIREBASE_STORAGE_BUCKET=%s\nAPP_URL=%s\n' \
            "$EMAIL_USER" \
            "$EMAIL_PASS" \
            "$VITE_GEMINI_API_KEY" \
            "$VITE_FIREBASE_API_KEY" \
            "$INTEGRATION_ENCRYPTION_KEY" \
            "$AI_DAILY_TOKEN_LIMIT" \
            "$AI_DAILY_GROUNDED_LIMIT" \
            "$PROJECT_ID" \
            "$STORAGE_BUCKET" \
            "$APP_URL" \
            > functions/.env
          echo "✅ functions/.env oluşturuldu:"
          sed 's/=.*/=***/' functions/.env
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          # GitHub secret'ının adı tarihsel olarak VITE_ önekli; fonksiyona
          # GEMINI_API_KEY adıyla gidiyor (sunucu yalnızca bu adı okur).
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          # OAuth jeton şifreleme anahtarı — DEĞİŞTİRİLİRSE kayıtlı Google/
          # Microsoft bağlantıları çözülemez ve kullanıcılar yeniden bağlanır.
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
          # SIR DEĞİL ama buradan geçiyor: fonksiyonlar ortam değişkenlerini
          # yalnızca bu dosyadan okuyor. Secret tanımlı değilse satır boş
          # yazılır ve günlük AI bütçe freni KAPALI kalır — mevcut kurulumun
          # davranışı değişmez (bkz. functions/services/aiBudget.js).
          AI_DAILY_TOKEN_LIMIT: ${{ secrets.AI_DAILY_TOKEN_LIMIT }}
          # Aramalı çağrı ADEDİ — token tavanından ayrı bir fatura kalemi:
          # arama destekli çağrılar istek başına faturalanıyor ve token
          # tavanı bu kalemi görmüyor.
          AI_DAILY_GROUNDED_LIMIT: ${{ secrets.AI_DAILY_GROUNDED_LIMIT }}

      # Anahtar dosyası env üzerinden yazılıyor (önceden `echo '${{ … }}'`):
      # JSON'daki bir tek tırnak kabuğu bozabiliyordu. Ardından anahtarın
      # HANGİ PROJEYE ait olduğu denetleniyor — eski projenin anahtarı secret'ta
      # unutulursa dağıtım yetki hatasıyla değil, burada açık bir mesajla durur.
      - name: Authenticate to Google Cloud
        run: |
          printf '%s' "$SA_JSON" > /tmp/gcp-sa.json
          SA_PROJECT=$(node -p "require('/tmp/gcp-sa.json').project_id")
          if [ "$SA_PROJECT" != "$PROJECT_ID" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT başka bir projeye ait ($SA_PROJECT ≠ $PROJECT_ID)"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> $GITHUB_ENV
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        # ── YALNIZCA TALENTFLOW'UN PARÇALARI (paylaşılan proje) ──────────────
        # Düz `firebase deploy` YASAK: hosting'in tamamı ve tüm codebase'ler
        # anlamına gelir. Burada:
        #   hosting:<site>      → yalnızca firebase.json'daki adlı site
        #                         (Hub-Inn'in agentinn-nyqpx'i, CX-Inn'in cxinn'i değişmez)
        #   functions:talentflow → yalnızca bu codebase (talentflowApi). CLI,
        #                         filtre bir codebase adıysa onu codebase filtresi
        #                         sayıyor; projedeki diğer fonksiyonlar (Hub-Inn'in
        #                         `api` codebase'i: api, leadScan) hiç planlanmıyor.
        #   firestore, storage  → kurallar. Proje GENELİ: (default) veritabanı ve
        #                         varsayılan bucket. Hub-Inn ve CX-Inn ikisini de
        #                         kullanmıyor (Postgres); kullanmaya başlarlarsa
        #                         kuralların tek sahibi konuşulmalı.
        # 'storage' önceden listede YOKTU: storage.rules üretime hiç gitmiyordu
        # ve toplu yüklemenin bulk-imports/{uid}/ yoluna yazması sessizce
        # "permission denied" alıyordu.
        #
        # --force KALIYOR — neden güvenli: firebase-tools silme adaylarını
        # codebase başına hesaplıyor (functionsDeployHelper
        # groupEndpointsByCodebase + planner.calculateChangesets); filtre
        # `functions:talentflow` olduğu için aday listesi yalnızca `talentflow`
        # codebase etiketli (ya da kaynaktaki bir adla eşleşen) fonksiyonlar.
        # Başka codebase'in fonksiyonu --force ile de silinemez.
        # Bayrak gerekli çünkü CI'da şu soruları kendisi onaylıyor: Artifact
        # Registry temizleme politikası (onay gelmezse dağıtım başarılı olsa da
        # hata koduyla biter — demo-deploy.yml'de yaşandı; europe-west1'deki depo
        # Hub-Inn'le ortak ve Hub-Inn de --force ile dağıttığı için politika
        # büyük olasılıkla zaten var) ve `talentflow` içindeki "güvensiz"
        # güncellemeler/silmeler.
        #
        # Son kapı (check:project'ten bağımsız, kasten burada tekrarlanıyor):
        # tek hosting girdisi + adlı site, tek functions girdisi + codebase
        # `talentflow`. Biri tutmazsa hiçbir şey dağıtılmaz.
        run: |
          SITE=$(node -e '
            const c = require("./firebase.json");
            const h = Array.isArray(c.hosting) ? c.hosting : [c.hosting].filter(Boolean);
            const f = Array.isArray(c.functions) ? c.functions : [c.functions].filter(Boolean);
            const bad = (m) => { console.error("❌ " + m); process.exit(1); };
            if (h.length !== 1) bad("firebase.json: tam olarak bir hosting girdisi olmalı (" + h.length + " var)");
            if (!h[0].site) bad("firebase.json: hosting.site yok — dağıtım projenin varsayılan sitesine (Hub-Inn) giderdi");
            if (f.length !== 1 || f[0].codebase !== "talentflow") bad("firebase.json: functions tek girdi ve codebase \"talentflow\" olmalı");
            process.stdout.write(h[0].site);
          ') || exit 1
          echo "Dağıtılıyor: site $SITE, codebase talentflow, kurallar → $PROJECT_ID"
          firebase deploy \
            --only "hosting:$SITE,functions:talentflow,firestore,storage" \
            --project "$PROJECT_ID" \
            --non-interactive \
            --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa.json
        # Env vars are picked up automatically from functions/.env (created
        # in the "Create functions/.env" step above). Firebase Functions v2
        # injects them into the Cloud Run revision during deploy — no manual gcloud
        # run services update is needed. The previous manual step referenced a fixed
        # image tag (api:version_1) that Firebase no longer produces, causing CI
        # failures while the actual deploy had already succeeded.
