# CI — runs on every PR and on pushes to main.
#
# Four parallel jobs:
#   - lint:  dep-drift, ESLint (baseline-locked), Prettier, tsc --noEmit
#   - test:  Vitest with coverage gate (50% on curated service slice)
#   - build: Vite production build
#   - e2e:   Playwright smoke tests against `vite preview` (no Firebase
#            secrets required — public-route smokes only)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs when a branch is pushed to repeatedly.
#
# MAIN HARİÇ. Dal üzerinde arka arkaya itilen commit'lerde eski turu kesmek
# doğru: kimse artık o commit'i incelemiyor. `main` başka: oraya giden her
# commit YAYINA GİDİYOR ve tek başına doğrulanmış olmalı.
#
# Canlıda yaşandı — iki PR saniyeler arayla merge edildi, ikisi de main'e
# ittiği için aynı gruba düştü ve ikincisi birincinin turunu iptal etti
# (CI #448, altı işin altısı `cancelled`). O sefer kurtaran şey merge'lerin
# ardışık olmasıydı: ikinci merge commit'i birincinin kodunu da içeriyordu ve
# turu yeşil geçti. Ama ikinci tur KIRMIZI çıksaydı, birinci PR'ın kodu
# main'de hiç doğrulanmamış kalacaktı ve bunu gösteren tek kayıt da iptal
# edilmiş turdu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Dependency-drift guard. Catches the Phase 4b regression class:
      # a package added to root package.json that gets imported in
      # functions/ source but is missing from functions/package.json.
      # Cloud Build only installs functions/package.json, so the missing
      # dep crashes Cloud Run at startup with ERR_MODULE_NOT_FOUND. Cheap
      # check (~50ms) — no npm install needed beyond the one above.
      - name: Backend dependency drift check
        run: npm run check:deps
      # lint:ci enforces the baseline warning count via --max-warnings. Adding
      # warnings without removing equivalents elsewhere will fail this gate.
      - name: ESLint (baseline-locked)
        run: npm run lint:ci
      # Prettier check — fails if any committed file would be reformatted.
      # This relies on lint-staged having auto-formatted touched files locally
      # before commit.
      - name: Prettier check
        run: npm run format:check
      # TypeScript type check on .ts/.tsx files. With `allowJs: true` and
      # `checkJs: false` in tsconfig.json, .js files are accepted as inputs
      # but not type-checked, so this gate only validates the slice of the
      # codebase that has graduated to TS. Phase 4e migrates one module
      # (pii.ts) as a demo; future PRs add more.
      - name: TypeScript typecheck
        run: npm run typecheck

  audit:
    name: Bağımlılık taraması
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── EŞİK NEDEN "critical" ─────────────────────────────────────────────
      # Bu iş eklendiğinde depoda 3 kritik ve 40 yüksek açık vardı; hepsi
      # düzeltilebilir olanları kapatıldıktan sonra kritik SIFIRA indi.
      # Eşiği kritikte tutmak, sıfırdan geriye gidilmesini engelliyor.
      #
      # Yüksek ve orta seviye açıklar RAPORLANIYOR ama işi düşürmüyor: kalanlar
      # kırıcı sürüm yükseltmesi gerektiriyor (puppeteer, nodemailer, adm-zip)
      # ve bunlar ayrı ayrı denenmesi gereken işler. Bugün düşüren bir eşik
      # koymak, herkesin işi kırmızıyken çalışmayı öğrenmesiyle biterdi —
      # kapatılan bir uyarı, olmayan uyarıdan kötü.
      #
      # --omit=dev: geliştirme araçlarının açıkları üretime çıkmıyor. Karışık
      # bir liste, gerçekten yayına giden riski gizler.
      - run: npm ci --no-audit --no-fund
      - name: Kök bağımlılıklar — kritik açık var mı
        run: npm audit --omit=dev --audit-level=critical

      - run: npm ci --no-audit --no-fund
        working-directory: ./functions
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Fonksiyon bağımlılıkları — kritik açık var mı
        working-directory: ./functions
        run: npm audit --omit=dev --audit-level=critical

      # Kalanlar özet olarak görünsün: eşiği geçmeyen açıkların da bir yerde
      # okunabilir olması gerekiyor, yoksa "kritik yok" cümlesi tabloyu
      # olduğundan iyi gösterir.
      - name: Kalan açıkların özeti
        if: always()
        run: |
          echo "### Bağımlılık açıkları" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "kök:" >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev 2>&1 | tail -3 >> $GITHUB_STEP_SUMMARY || true
          echo "functions:" >> $GITHUB_STEP_SUMMARY
          (cd functions && npm audit --omit=dev 2>&1 | tail -3) >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Vitest with coverage — the gate is configured in vitest.config.js
      # (50% across statements/branches/functions/lines on the curated
      # service slice). Phase 4d adds Playwright E2E as a separate job.
      - name: Vitest (with coverage gate)
        run: npm run test:coverage
      # Upload the HTML coverage report so reviewers can drill into hot
      # spots without running the suite locally.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Vite build
        run: npm run build
        env:
          # Build runs without real Firebase keys — the bundle compiles fine
          # without them since Vite only warns on missing VITE_* vars.
          NODE_ENV: production
      - name: Bundle size budget check
        # Guards the gain from PR #35 (route-level lazy loading). Fails
        # the build if the main app chunk grows past the budget defined
        # in scripts/check-bundle-size.mjs.
        run: npm run check:bundle-size

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Cache the Playwright browser binaries — they're ~300MB and
      # downloading them every CI run dominates the job time. Keyed on
      # the @playwright/test version pinned in package-lock.json.
      - name: Get Playwright version
        id: pw
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      # The build runs as part of the e2e job (rather than reusing the
      # build job's artifact) for simplicity. Adds ~25s but keeps the
      # workflow flat — no inter-job artifact passing.
      - name: Vite build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: 'true'
      # Always upload the HTML report + traces so debugging a flake
      # doesn't require rerunning locally.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  e2e-auth:
    name: E2E (Playwright authenticated)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Get Playwright version
        id: pw
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      # The auth-suite config (playwright.config.auth.js) handles its
      # own build via `npm run build:e2e-auth` — that build picks up
      # `.env.e2e-auth` which sets VITE_E2E_MOCK_AUTH=true plus a fake
      # Firebase config. The mock-auth branch in AuthContext then
      # short-circuits before any real network call. No emulator,
      # no real secrets.
      - name: Run Playwright tests (authenticated suite)
        run: npm run test:e2e:auth
        env:
          CI: 'true'
      - name: Upload Playwright report (auth)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-auth
          path: playwright-report-auth/
          retention-days: 7
      - name: Upload Playwright traces (auth)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-auth
          path: test-results/
          retention-days: 7

  e2e-emulator:
    name: E2E (Playwright real-auth via Firebase emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # The Firebase Auth + Firestore emulators are JVM processes.
      # Without Java the `firebase emulators:exec` command fails to
      # spawn them. Eclipse Temurin 17 is the LTS that firebase-tools
      # currently recommends.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools >=14 dropped Java 17 support; needs 21+.
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      # firebase-tools is required to run the emulators. We install it
      # at the job level instead of as a devDependency to keep
      # node_modules lean for the other jobs (the package weighs in
      # north of 50 MB).
      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest
      - name: Get Playwright version
        id: pw
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      # The emulator config wraps Vite preview in `firebase emulators:exec`
      # so Playwright sees both the running emulators and the served
      # SPA. Global setup seeds a recruiter user via REST before tests.
      - name: Run Playwright tests (real-auth via emulator)
        run: npm run test:e2e:emulator
        env:
          CI: 'true'
      - name: Upload Playwright report (emulator)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-emulator
          path: playwright-report-emulator/
          retention-days: 7
      - name: Upload Playwright traces (emulator)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-emulator
          path: test-results/
          retention-days: 7
