<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ti-accent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#29A9E0"/>
      <stop offset="100%" stop-color="#13C2BE"/>
    </linearGradient>
  </defs>

  <!-- Circuit traces (left) -->
  <g stroke="#29A9E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14 42 H24 L30 48"/>
    <path d="M9 56 H22"/>
    <path d="M14 70 H24 L30 64"/>
  </g>
  <g fill="#FFFFFF" stroke="#29A9E0" stroke-width="3">
    <circle cx="11" cy="42" r="3.2"/>
    <circle cx="6" cy="56" r="3.2"/>
    <circle cx="11" cy="70" r="3.2"/>
  </g>

  <!-- Document with folded corner -->
  <path d="M38 18 H66 L82 34 V82 A4 4 0 0 1 78 86 H38 A4 4 0 0 1 34 82 V22 A4 4 0 0 1 38 18 Z"
        fill="#FFFFFF" stroke="#13294E" stroke-width="5" stroke-linejoin="round"/>
  <path d="M66 18 V30 A4 4 0 0 0 70 34 H82" fill="none" stroke="#13294E" stroke-width="5" stroke-linejoin="round"/>

  <!-- Person avatar -->
  <circle cx="51" cy="42" r="13.5" fill="none" stroke="#13294E" stroke-width="4"/>
  <circle cx="51" cy="38" r="5.2" fill="#13294E"/>
  <path d="M42 51 A9 9 0 0 1 60 51" fill="#13294E"/>
  <!-- Teal verified check -->
  <circle cx="62" cy="50" r="6.5" fill="url(#ti-accent)"/>
  <path d="M59 50 l2 2 l4 -4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- List rows -->
  <circle cx="44" cy="62" r="2.4" fill="#29A9E0"/>
  <line x1="50" y1="62" x2="68" y2="62" stroke="#13294E" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="44" cy="70" r="2.4" fill="#29A9E0"/>
  <line x1="50" y1="70" x2="64" y2="70" stroke="#13294E" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="44" cy="78" r="2.4" fill="#29A9E0"/>
  <line x1="50" y1="78" x2="60" y2="78" stroke="#13294E" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Magnifier (bottom-right, overlapping) -->
