  <line x1="78" y1="80" x2="86" y2="88" stroke="#13294E" stroke-width="6" stroke-linecap="round"/>
  <line x1="63" y1="69" x2="75" y2="69" stroke="#29A9E0" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="63" y1="74" x2="75" y2="74" stroke="#13C2BE" stroke-width="2.6" stroke-linecap="round"/>
